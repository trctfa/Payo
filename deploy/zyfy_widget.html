  const audioCache = new Map();   // 「配音員\u0000文字」-> wav Blob（唸過就不重新合成）
  const AUTO_KEY = 'zyfy_autosave_v1';
  let sharedPlayer = null;

  function status(text, isErr) {

  function setBusy(busy) {

  // ---------- Gradio API ----------
  const configCache = {};
  async function getFnIndex(appBase, apiName) {
    if (!configCache[appBase]) {
      configCache[appBase] = await (await fetch(appBase + '/config')).json();
    }
    const dep = configCache[appBase].dependencies.find(d => d.api_name === apiName);
    if (!dep) throw new Error('找不到 API：' + apiName);
    return dep.id;
  }

  const newSession = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

  async function gradioCall(appBase, apiName, data, sessionHash) {
    const fnIndex = await getFnIndex(appBase, apiName);

    // 順序很重要：先送 queue/join（伺服器會暫存結果），再開 SSE 監聽。
    const res = await fetch(appBase + '/gradio_api/queue/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data, fn_index: fnIndex, session_hash: sessionHash })
    });
    if (!res.ok) throw new Error('排隊失敗 HTTP ' + res.status);

    return new Promise((resolve, reject) => {
      const es = new EventSource(appBase + '/gradio_api/queue/data?session_hash=' + sessionHash);
      const timer = setTimeout(() => fail(new Error(apiName + ' 等待逾時')), 180000);
      function fail(err) { clearTimeout(timer); es.close(); reject(err); }

      es.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.msg === 'process_completed') {
          clearTimeout(timer);
          es.close();
          if (msg.success === false) reject(new Error(apiName + ' 後端處理失敗'));
          else resolve(msg.output.data);
        }
      };
      es.onerror = () => fail(new Error(apiName + ' 連線中斷'));
    });
  }

  // 翻譯前必須用同一 session 先呼叫 lambda_1 解鎖該族別的語別選項
  async function translateOne(langCode, text, session) {
    let sess = session;
    if (!sess) {
      sess = newSession();
      await gradioCall(TRANSLATE_APP, 'lambda_1', [ethSel.value], sess);
    }
    const out = await gradioCall(TRANSLATE_APP, 'translate_1', [text, 'zho_Hant', langCode], sess);
    return (out[0] || '').trim();
  }

  // 取得語音（含快取）
  async function getAudio(speaker, text, session) {
    const key = speaker + '\u0000' + text;
    if (audioCache.has(key)) return audioCache.get(key);
    if (text.length > 300) throw new Error('文字超過 300 字元上限');
    let sess = session;
    if (!sess) {
      sess = newSession();
      await gradioCall(TTS_APP, 'lambda', [ethSel.value], sess);
    }
    const out = await gradioCall(TTS_APP, 'default_speaker_tts', [speaker, text], sess);
    const file = out[0];
    if (!file || !file.url) throw new Error('合成結果沒有音檔');
    const blob = await (await fetch(file.url)).blob();
    audioCache.set(key, blob);
    return blob;
  }

  function sanitizeFilename(name) {
    name = (name || '').replace(/[\\\/:\*\?"<>\|\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (name.length > 60) name = name.slice(0, 60).trim();
    return name || 'tts_audio';
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  function timeStamp() {
    const d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
           '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  }

  // ---------- WAV 串接（純前端，不需任何套件） ----------
  function wavChunks(buf) {
    const dv = new DataView(buf);
    let off = 12, fmt = null, data = null;
    while (off + 8 <= dv.byteLength) {
      const id = String.fromCharCode(dv.getUint8(off), dv.getUint8(off + 1), dv.getUint8(off + 2), dv.getUint8(off + 3));
      const size = dv.getUint32(off + 4, true);
      if (id === 'fmt ') fmt = { channels: dv.getUint16(off + 10, true), rate: dv.getUint32(off + 12, true), bits: dv.getUint16(off + 22, true) };
      if (id === 'data') { data = { offset: off + 8, size }; break; }
      off += 8 + size + (size % 2);
    }
    if (!fmt || !data) throw new Error('WAV 格式解析失敗');
    return { fmt, data };
  }

  async function mergeWavBlobs(blobs, gapSeconds) {
    const bufs = [];
    for (const b of blobs) bufs.push(await b.arrayBuffer());
    const { fmt } = wavChunks(bufs[0]);
    const bytesPerFrame = fmt.channels * fmt.bits / 8;
    const gapBytes = Math.floor(fmt.rate * gapSeconds) * bytesPerFrame;

    const parts = [];
    let total = 0;
    bufs.forEach((buf, i) => {
      const { data } = wavChunks(buf);
      if (i > 0 && gapBytes) { parts.push(new Uint8Array(gapBytes)); total += gapBytes; }
      parts.push(new Uint8Array(buf, data.offset, data.size));
      total += data.size;
    });

    const header = new ArrayBuffer(44);
    const dv = new DataView(header);
    const wstr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    wstr(0, 'RIFF'); dv.setUint32(4, 36 + total, true); wstr(8, 'WAVE');
    wstr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
    dv.setUint16(22, fmt.channels, true); dv.setUint32(24, fmt.rate, true);
    dv.setUint32(28, fmt.rate * bytesPerFrame, true); dv.setUint16(32, bytesPerFrame, true); dv.setUint16(34, fmt.bits, true);
    wstr(36, 'data'); dv.setUint32(40, total, true);
    return new Blob([header, ...parts], { type: 'audio/wav' });
  }

  // ---------- 選項載入 ----------
  async function loadOptions() {
    status('載入語別與配音員…');
    langSel.innerHTML = spkSel.innerHTML = '';
    try {
      const [langData, spkData] = await Promise.all([
        gradioCall(TRANSLATE_APP, 'lambda_1', [ethSel.value], newSession()),
        gradioCall(TTS_APP, 'lambda', [ethSel.value], newSession())
      ]);
      for (const [label, code] of langData[0].choices) langSel.add(new Option(label, code));
      for (const [label] of spkData[0].choices) spkSel.add(new Option(label, label));
      // 預設選擇：阿美_南勢／阿美_南勢_女聲（清單裡沒有就維持第一個）
      const defLang = langData[0].choices.find(c => c[0] === DEFAULT_LANG_LABEL);
      if (defLang) langSel.value = defLang[1];
      if ([...spkSel.options].some(o => o.value === DEFAULT_SPEAKER)) spkSel.value = DEFAULT_SPEAKER;

      // 開啟專案／自動復原：選項載入完再套用內容
      if (pendingProject) {
        const p = pendingProject;
        pendingProject = null;
        applyProjectData(p, langData[0].choices, spkData[0].choices);
      } else {
        status('');
      }
    } catch (err) {
      status('載入選項失敗：' + err.message, true);
    }
  }
  ethSel.addEventListener('change', () => {
    scheduleAutosave();
    loadOptions();
  });

  // ---------- 編輯區 ----------
  function addRow(zh, tr) {
    const row = document.createElement('div');
    row.className = 'zyfy-row';
    row.innerHTML =
      '<div class="zyfy-row-side">' +
        '<input type="checkbox" class="zyfy-check" title="勾選後可匯出勾選或刪除勾選">' +
        '<button type="button" class="zyfy-icon zyfy-re" title="重新翻譯這一句">' + ICON_RETRY + '</button>' +
        '<button type="button" class="zyfy-icon zyfy-play" title="唸這一句">' + ICON_PLAY + '</button>' +
        '<button type="button" class="zyfy-icon zyfy-dl1" title="下載這一句的音檔">' + ICON_DL + '</button>' +
        '<button type="button" class="zyfy-icon zyfy-dict-btn" title="查字典（族語E樂園）">' + ICON_BOOK + '</button>' +
        '<button type="button" class="zyfy-icon zyfy-del" title="刪除這一句">' + ICON_DEL + '</button>' +
      '</div>' +
      '<div class="zyfy-row-main">' +
        '<input type="text" class="zyfy-zh" placeholder="中文">' +
        '<input type="text" class="zyfy-tr" placeholder="族語翻譯">' +
      '</div>';
    row.querySelector('.zyfy-zh').value = zh;
    row.querySelector('.zyfy-tr').value = tr;
    row.querySelector('.zyfy-zh').addEventListener('input', scheduleAutosave);
    row.querySelector('.zyfy-tr').addEventListener('input', scheduleAutosave);
    row.querySelector('.zyfy-check').addEventListener('change', scheduleAutosave);

    // ↻ 重新翻譯這一句
    row.querySelector('.zyfy-re').addEventListener('click', async (ev) => {
      if (isBusy()) return;
      const btn = ev.currentTarget;
      const zhNow = row.querySelector('.zyfy-zh').value.trim();
      if (!zhNow) { status('這一行的中文是空的', true); return; }
      btn.disabled = true; btn.classList.add('zyfy-busy');
      try {
        status('重新翻譯：' + zhNow);
        const native = await translateOne(langSel.value, zhNow);
        row.querySelector('.zyfy-tr').value = native;
        status('重新翻譯完成：' + native);
        scheduleAutosave();
      } catch (err) {
        status('重翻失敗：' + err.message, true);
      } finally {
        btn.disabled = false; btn.classList.remove('zyfy-busy');
      }
    });

    // ▶ 唸這一句
    row.querySelector('.zyfy-play').addEventListener('click', async (ev) => {
      if (isBusy()) return;
      const btn = ev.currentTarget;
      const tr2 = row.querySelector('.zyfy-tr').value.trim();
      if (!tr2) { status('這一行還沒有翻譯文字', true); return; }
      btn.disabled = true; btn.classList.add('zyfy-busy');
      try {
        const cached = audioCache.has(spkSel.value + '\u0000' + tr2);
        if (!cached) status('合成語音中（約 5～20 秒）：' + tr2);
        const blob = await getAudio(spkSel.value, tr2);
        if (sharedPlayer) { sharedPlayer.pause(); }
        sharedPlayer = new Audio(URL.createObjectURL(blob));
        await sharedPlayer.play();
        status('▶ 播放：' + tr2);
      } catch (err) {
        status('試聽失敗：' + err.message, true);
      } finally {
        btn.disabled = false; btn.classList.remove('zyfy-busy');
      }
    });

    // ⭳ 下載這一句
    row.querySelector('.zyfy-dl1').addEventListener('click', async (ev) => {
      if (isBusy()) return;
      const btn = ev.currentTarget;
      const tr2 = row.querySelector('.zyfy-tr').value.trim();
      if (!tr2) { status('這一行還沒有翻譯文字', true); return; }
      btn.disabled = true; btn.classList.add('zyfy-busy');
      try {
        const cached = audioCache.has(spkSel.value + '\u0000' + tr2);
        if (!cached) status('合成語音中（約 5～20 秒）：' + tr2);
        const blob = await getAudio(spkSel.value, tr2);
        downloadBlob(blob, sanitizeFilename(tr2) + '.wav');
        status('已下載：' + sanitizeFilename(tr2) + '.wav');
      } catch (err) {
        status('下載失敗：' + err.message, true);
      } finally {
        btn.disabled = false; btn.classList.remove('zyfy-busy');
      }
    });

    // ✕ 刪除這一句
    row.querySelector('.zyfy-del').addEventListener('click', () => {
      if (isBusy()) return;
      row.remove();
      if (dictTargetRow === row) closeDict();
      if (!rowsEl.querySelector('.zyfy-row')) editorEl.classList.remove('zyfy-show');
      status('已刪除 1 句，剩餘 ' + rowsEl.querySelectorAll('.zyfy-row').length + ' 句');
      scheduleAutosave();
    });

    // 📖 查字典
    row.querySelector('.zyfy-dict-btn').addEventListener('click', () => {
      if (isBusy()) return;
      openDictForRow(row);
    });

    rowsEl.appendChild(row);
  }

  function collectRows(selectedOnly) {
    const items = [];
    for (const row of rowsEl.querySelectorAll('.zyfy-row')) {
      if (selectedOnly && !row.querySelector('.zyfy-check').checked) continue;
      const zh = row.querySelector('.zyfy-zh').value.trim();
      const tr = row.querySelector('.zyfy-tr').value.trim();
      if (zh && tr) items.push({ zh, tr });
    }
    return items;
  }

  // ---------- 翻譯全部 ----------
  translateBtn.addEventListener('click', async () => {
    const lines = inputBox.value.split('\n').map(s => s.trim()).filter(s => s);
    if (!lines.length) { status('請先貼上中文（一行一句）', true); return; }
    if (!langSel.value) { status('語別尚未載入完成', true); return; }

    setBusy(true);
    rowsEl.innerHTML = '';
    editorEl.classList.remove('zyfy-show');
    try {
      // 整批共用同一個 session：解鎖一次族別即可
      const sess = newSession();
      await gradioCall(TRANSLATE_APP, 'lambda_1', [ethSel.value], sess);

      for (let i = 0; i < lines.length; i++) {
        status('翻譯中（' + (i + 1) + '/' + lines.length + '）：' + lines[i]);
        let native = '';
        try {
          native = await translateOne(langSel.value, lines[i], sess);
        } catch (err) {
          console.error(err);
        }
        addRow(lines[i], native);
        editorEl.classList.add('zyfy-show');
      }
      status('翻譯完成，共 ' + lines.length + ' 句。可在編輯區修改文字、逐句重翻或試聽，再匯出。');
      scheduleAutosave();
    } catch (err) {
      console.error(err);
      status('失敗：' + err.message, true);
    } finally {
      setBusy(false);
    }
  });

  // ---------- 專案：儲存／開啟／自動復原（與 GUI 通用 JSON） ----------
  function snapshotProject() {
    const rows = [];
    for (const row of rowsEl.querySelectorAll('.zyfy-row')) {
      rows.push({
        zh: row.querySelector('.zyfy-zh').value,
        tr: row.querySelector('.zyfy-tr').value,
        checked: !!row.querySelector('.zyfy-check').checked
      });
    }
    return {
      app: 'zyfy-project',
      version: 1,
      ethnicity: ethSel.value,
      lang_label: langSel.selectedOptions[0] ? langSel.selectedOptions[0].text : '',
      speaker: spkSel.value,
      input: inputBox.value,
      text_only: !!textOnlyCb.checked,
      rows: rows
    };
  }

  function applyProjectData(p, langChoices, spkChoices) {
    suppressAutosave = true;
    try {
      if (p.lang_label) {
        const hit = (langChoices || []).find(c => c[0] === p.lang_label);
        if (hit) langSel.value = hit[1];
      }
      if (p.speaker && [...spkSel.options].some(o => o.value === p.speaker)) {
        spkSel.value = p.speaker;
      }
      if (typeof p.input === 'string') inputBox.value = p.input;
      if (typeof p.text_only === 'boolean') textOnlyCb.checked = p.text_only;

      rowsEl.innerHTML = '';
      for (const r of (p.rows || [])) {
        addRow(r.zh || '', r.tr || '');
        const last = rowsEl.lastElementChild;
        if (last && r.checked) last.querySelector('.zyfy-check').checked = true;
      }
      if ((p.rows || []).length) editorEl.classList.add('zyfy-show');
      else editorEl.classList.remove('zyfy-show');
      status('✓ 專案已載入，共 ' + (p.rows || []).length + ' 句，可以繼續編輯');
    } finally {
      suppressAutosave = false;
      scheduleAutosave();
    }
  }

  function openProjectObject(data) {
    if (!data || data.app !== 'zyfy-project' || !Array.isArray(data.rows)) {
      throw new Error('不是族語專案檔');
    }
    pendingProject = data;
    if (data.ethnicity && [...ethSel.options].some(o => o.value === data.ethnicity)) {
      ethSel.value = data.ethnicity;
    }
    status('開啟專案中（載入選項…）');
    loadOptions();
  }

  let autosaveTimer = null;
  function scheduleAutosave() {
    if (suppressAutosave) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      try {
        const snap = snapshotProject();
        if (!snap.rows.length && !(snap.input || '').trim()) {
          localStorage.removeItem(AUTO_KEY);
          return;
        }
        localStorage.setItem(AUTO_KEY, JSON.stringify(snap));
      } catch (e) {
        console.warn('自動儲存失敗', e);
      }
    }, 400);
  }

  saveProjBtn.addEventListener('click', () => {
    const snap = snapshotProject();
    if (!snap.rows.length) {
      status('編輯區還沒有內容，沒有東西可以存', true);
      return;
    }
    const blob = new Blob([JSON.stringify(snap, null, 1)], { type: 'application/json;charset=utf-8' });
    downloadBlob(blob, '族語專案_' + ethSel.value + '_' + timeStamp() + '.json');
    status('✓ 專案已下載，下次可用「開啟專案」繼續編輯');
    scheduleAutosave();
  });

  openProjBtn.addEventListener('click', () => projFileInput.click());
  projFileInput.addEventListener('change', async () => {
    const file = projFileInput.files && projFileInput.files[0];
    projFileInput.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      openProjectObject(data);
    } catch (err) {
      status('無法讀取專案檔：' + err.message, true);
    }
  });

  inputBox.addEventListener('input', scheduleAutosave);
  textOnlyCb.addEventListener('change', scheduleAutosave);
  langSel.addEventListener('change', scheduleAutosave);
  spkSel.addEventListener('change', scheduleAutosave);

  // 啟動：若有自動儲存內容就復原，否則載入預設選項
  try {
    const raw = localStorage.getItem(AUTO_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.app === 'zyfy-project' && Array.isArray(data.rows) && data.rows.length) {
        openProjectObject(data);
      } else {
        loadOptions();
      }
    } else {
      loadOptions();
    }
  } catch (e) {
    loadOptions();
  }

  // ---------- 匯出（全部／勾選） ----------
  async function doExport(selectedOnly) {
    const items = collectRows(selectedOnly);
    if (!items.length) {
      status(selectedOnly ? '沒有勾選任何句子' : '編輯區沒有可匯出的句子', true);
      return;
    }
    const textOnly = textOnlyCb.checked;
    setBusy(true);
    try {
      if (!textOnly) {
        const sess = newSession();
        await gradioCall(TTS_APP, 'lambda', [ethSel.value], sess);   // 解鎖配音員，一次即可
        for (let i = 0; i < items.length; i++) {
          status('合成中（' + (i + 1) + '/' + items.length + '）：' + items[i].tr);
          const blob = await getAudio(spkSel.value, items[i].tr, sess);
          downloadBlob(blob, sanitizeFilename(items[i].tr) + '.wav');
          await new Promise(r => setTimeout(r, 400));  // 讓瀏覽器接受連續下載
        }
      }
      // 一行中文、一行翻譯，依編輯區順序（含 BOM 讓 Windows 記事本正確開啟）
      const txt = items.map(it => it.zh + '\n' + it.tr).join('\n') + '\n';
      const name = '翻譯對照' + (selectedOnly ? '_勾選' : '') + '_' + ethSel.value + '_' + timeStamp() + '.txt';
      downloadBlob(new Blob(['\ufeff' + txt], { type: 'text/plain;charset=utf-8' }), name);
      status('匯出完成！共 ' + items.length + ' 句' + (textOnly ? '（僅文字檔）' : '（音檔＋文字檔）') + '。');
    } catch (err) {
      console.error(err);
      status('匯出失敗：' + err.message, true);
    } finally {
      setBusy(false);
    }
  }
  exportAllBtn.addEventListener('click', () => doExport(false));
  exportSelBtn.addEventListener('click', () => doExport(true));

  // ---------- 全選／清除勾選／刪除勾選 ----------
  selectAllBtn.addEventListener('click', () => {
    const rows = rowsEl.querySelectorAll('.zyfy-row');
    if (!rows.length) { status('編輯區還沒有句子', true); return; }
    for (const row of rows) row.querySelector('.zyfy-check').checked = true;
    status('已全選 ' + rows.length + ' 句');
    scheduleAutosave();
  });
  clearSelBtn.addEventListener('click', () => {
    const rows = rowsEl.querySelectorAll('.zyfy-row');
    for (const row of rows) row.querySelector('.zyfy-check').checked = false;
    status(rows.length ? '已清除勾選' : '編輯區還沒有句子');
    scheduleAutosave();
  });
  deleteSelBtn.addEventListener('click', () => {
    if (isBusy()) return;
    const checked = [...rowsEl.querySelectorAll('.zyfy-row')].filter(r => r.querySelector('.zyfy-check').checked);
    if (!checked.length) { status('請先勾選要刪除的句子', true); return; }
    if (!confirm('確定刪除勾選的 ' + checked.length + ' 句嗎？')) return;
    for (const row of checked) {
      if (dictTargetRow === row) closeDict();
      row.remove();
    }
    const left = rowsEl.querySelectorAll('.zyfy-row').length;
    if (!left) editorEl.classList.remove('zyfy-show');
    status('✓ 已刪除 ' + checked.length + ' 句，剩餘 ' + left + ' 句');
    scheduleAutosave();
  });

  // ---------- Klokah 查字典（內嵌＋套用） ----------
  function currentDialectId() {
    const label = langSel.selectedOptions[0] ? langSel.selectedOptions[0].text : '';
    if (KLOKAH_DIALECT[label] != null) return { id: KLOKAH_DIALECT[label], label };
    // 容錯：部分標籤可能多了底線後綴，用包含比對
    for (const [k, v] of Object.entries(KLOKAH_DIALECT)) {
      if (label.includes(k) || k.includes(label)) return { id: v, label: k };
    }
    return { id: null, label };
  }

  function getInputSelection(el) {
    if (!el || typeof el.selectionStart !== 'number') return '';
    if (el.selectionStart === el.selectionEnd) return '';
    return el.value.slice(el.selectionStart, el.selectionEnd).trim();
  }

  function closeDict() {
    dictPanel.hidden = true;
    if (dictTargetRow) dictTargetRow.classList.remove('zyfy-active');
    dictTargetRow = null;
  }

  function openDictForRow(row) {
    for (const r of rowsEl.querySelectorAll('.zyfy-row')) r.classList.remove('zyfy-active');
    dictTargetRow = row;
    row.classList.add('zyfy-active');
    dictPanel.hidden = false;

    const zhEl = row.querySelector('.zyfy-zh');
    const trEl = row.querySelector('.zyfy-tr');
    const selected = getInputSelection(trEl) || getInputSelection(zhEl);
    const q = selected || trEl.value.trim() || zhEl.value.trim();
    dictQ.value = q;
    dictList.innerHTML = '';
    if (q) runDictSearch();
    else {
      const d = currentDialectId();
      dictMeta.textContent = d.id
        ? ('語別：' + d.label + '（Klokah #' + d.id + '）。請輸入要查的字。')
        : ('目前語別「' + d.label + '」找不到對應的 Klokah 方言編號。');
      dictQ.focus();
    }
    dictPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function runDictSearch() {
    const q = dictQ.value.trim().slice(0, 80);
    if (!q) { dictMeta.textContent = '請輸入要查詢的字'; return; }
    dictQ.value = q;
    const d = currentDialectId();
    if (!d.id) {
      dictMeta.textContent = '目前語別「' + d.label + '」找不到對應的 Klokah 方言編號。';
      return;
    }
    dictMeta.textContent = '查詢中：「' + q + '」／' + d.label + '…';
    dictList.innerHTML = '';
    dictGo.disabled = true;
    try {
      const url = 'https://web.klokah.tw/api/multiSearchResult.php?d=' + d.id +
                  '&txt=' + encodeURIComponent(q);
      const xmlText = await (await fetch(url)).text();
      const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
      if (doc.querySelector('parsererror')) throw new Error('無法解析回傳資料');

      const items = [];
      const seen = new Set();
      for (const section of doc.documentElement.children) {
        const srcKey = section.tagName;
        const srcLabel = KLOKAH_SRC_NAME[srcKey] || srcKey;
        for (const item of section.querySelectorAll(':scope > item')) {
          const native = (item.querySelector('text') || {}).textContent || '';
          const chinese = (item.querySelector('chinese') || {}).textContent || '';
          const link = (item.querySelector('url') || {}).textContent || '';
          const key = native.trim() + '|' + chinese.trim();
          if (!native.trim() || seen.has(key)) continue;
          seen.add(key);
          items.push({ native: native.trim(), chinese: chinese.trim(), src: srcLabel, url: link.trim() });
        }
      }

      dictMeta.textContent = items.length
        ? ('找到 ' + items.length + ' 筆（' + d.label + '／關鍵字「' + q + '」）。點「套用」可寫入該行翻譯。')
        : ('沒有找到結果（' + d.label + '／「' + q + '」）。可改打單字或中文再試。');

      for (const it of items.slice(0, 40)) {
        const div = document.createElement('div');
        div.className = 'zyfy-dict-item';
        div.innerHTML =
          '<div class="zyfy-di-main">' +
            '<div class="zyfy-di-native"></div>' +
            '<div class="zyfy-di-zh"></div>' +
            '<div class="zyfy-di-src"></div>' +
          '</div>' +
          '<button type="button" class="zyfy-apply">套用</button>';
        div.querySelector('.zyfy-di-native').textContent = it.native;
        div.querySelector('.zyfy-di-zh').textContent = it.chinese || '（無中文對照）';
        const srcEl = div.querySelector('.zyfy-di-src');
        if (it.url) {
          srcEl.appendChild(document.createTextNode(it.src + ' · '));
          const a = document.createElement('a');
          a.href = it.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '在 E 樂園開啟';
          srcEl.appendChild(a);
        } else {
          srcEl.textContent = it.src;
        }
        div.querySelector('.zyfy-apply').addEventListener('click', () => {
          if (!dictTargetRow || !dictTargetRow.isConnected) {
            status('目標句子已不存在，請重新點該行的查字典', true);
            return;
          }
          const tr = dictTargetRow.querySelector('.zyfy-tr');
          tr.value = it.native;
          tr.dispatchEvent(new Event('input', { bubbles: true }));
          status('✓ 已套用到該行：' + it.native);
          scheduleAutosave();
        });
        dictList.appendChild(div);
      }
    } catch (err) {
      console.error(err);
      dictMeta.textContent = '查詢失敗：' + err.message;
    } finally {
      dictGo.disabled = false;
    }
  }

  dictGo.addEventListener('click', runDictSearch);
  dictQ.addEventListener('keydown', (e) => { if (e.key === 'Enter') runDictSearch(); });
  dictClose.addEventListener('click', closeDict);

  // ---------- 串接成一個語音檔 ----------
  exportMergeBtn.addEventListener('click', async () => {
    const items = collectRows(false);
    if (!items.length) { status('編輯區沒有可合成的句子', true); return; }
    setBusy(true);
    try {
      const sess = newSession();
      await gradioCall(TTS_APP, 'lambda', [ethSel.value], sess);
      const blobs = [];
      for (let i = 0; i < items.length; i++) {
        status('合成中（' + (i + 1) + '/' + items.length + '）：' + items[i].tr);
        blobs.push(await getAudio(spkSel.value, items[i].tr, sess));
      }
      status('串接中…');
      const merged = await mergeWavBlobs(blobs, 0.4);
      const name = '串接語音_' + sanitizeFilename(items[0].tr).slice(0, 20) + '_共' + items.length + '句.wav';
      downloadBlob(merged, name);
      status('串接完成！已下載 ' + name);
    } catch (err) {
      console.error(err);
      status('串接失敗：' + err.message, true);
    } finally {
      setBusy(false);
    }
  });

  }  // zyfyInit 結束
})();
</script>
