<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K 線與股價分析助手</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6fb;
        --card: #ffffff;
        --text: #101828;
        --subtext: #475467;
        --primary: #2563eb;
        --primary-press: #1d4ed8;
        --line: #d0d5dd;
        --good: #15803d;
        --bad: #b42318;
        --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC",
          "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .app {
        width: min(1080px, 100%);
        margin: 0 auto;
        padding: 1rem;
        display: grid;
        gap: 1rem;
      }

      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 1rem;
        box-shadow: var(--shadow);
      }

      .hero h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .hero p {
        margin-bottom: 0;
        color: var(--subtext);
        line-height: 1.5;
      }

      h2 {
        margin-top: 0;
        font-size: 1.125rem;
      }

      .form-grid {
        display: grid;
        gap: 0.85rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .input-form {
        display: grid;
        gap: 0.9rem;
      }

      .accordion {
        display: grid;
        gap: 0.65rem;
      }

      .accordion-item {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #f8fafc;
      }

      .accordion-item summary {
        list-style: none;
        cursor: pointer;
        padding: 0.8rem 0.9rem;
        display: grid;
        gap: 0.1rem;
        font-weight: 700;
        position: relative;
      }

      .accordion-item summary::marker,
      .accordion-item summary::-webkit-details-marker {
        display: none;
      }

      .accordion-item summary::after {
        content: "⌄";
        position: absolute;
        right: 1rem;
        font-size: 1rem;
        transition: transform 0.2s ease;
      }

      .accordion-item[open] summary::after {
        transform: rotate(180deg);
      }

      .accordion-item summary small {
        font-size: 0.8rem;
        color: var(--subtext);
        font-weight: 500;
      }

      .accordion-body {
        padding: 0 0.9rem 0.9rem;
        background: #fff;
        border-top: 1px solid #e4e7ec;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 0.75rem;
        color: var(--text);
        background: #fff;
      }

      textarea {
        resize: vertical;
        min-height: 80px;
      }

      small {
        color: var(--subtext);
        font-size: 0.8rem;
        font-weight: 500;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: var(--primary-press);
      }

      button.secondary {
        background: #e8eefc;
        color: #1e3a8a;
      }

      canvas {
        width: 100%;
        height: 260px;
        border-radius: 12px;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        border: 1px solid #e4e7ec;
      }

      .empty {
        color: var(--subtext);
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 1rem;
      }

      .hidden {
        display: none;
      }

      .result-card article + article {
        margin-top: 0.85rem;
      }

      .result-card h3 {
        margin-bottom: 0.25rem;
        font-size: 1rem;
      }

      .result-card p {
        margin: 0;
        line-height: 1.5;
      }

      .result-card ul {
        margin-top: 0.2rem;
        margin-bottom: 0;
        padding-left: 1.1rem;
      }

      @media (max-width: 780px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .app {
          padding: 0.75rem;
        }

        .card {
          border-radius: 14px;
          padding: 0.85rem;
        }

        .hero h1 {
          font-size: 1.3rem;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="hero card">
        <h1>K 線與股價分析助手</h1>
        <p>
          輸入股票資訊與 K 線資料，快速取得「目前股價的意義」與可執行的觀察重點。
        </p>
      </header>

      <section class="card">
        <h2>輸入資料</h2>
        <form id="analysis-form" class="input-form">
          <div class="accordion">
            <details class="accordion-item" id="accordion-basic" open>
              <summary>
                <span>基本選項</span>
                <small>股票代碼、市場、股價、週期、偏好</small>
              </summary>
              <div class="accordion-body form-grid">
                <label>
                  股票代碼
                  <input type="text" id="symbol" placeholder="例如：2330 / AAPL" required />
                </label>

                <label>
                  市場
                  <select id="market">
                    <option value="台股">台股</option>
                    <option value="美股">美股</option>
                    <option value="加密貨幣">加密貨幣</option>
                    <option value="其他">其他</option>
                  </select>
                </label>

                <label>
                  目前股價
                  <input
                    type="number"
                    id="price"
                    step="0.01"
                    min="0"
                    placeholder="例如：955"
                    required
                  />
                </label>

                <label>
                  K 線週期
                  <select id="timeframe">
                    <option value="1D">1D（日線）</option>
                    <option value="4H">4H（四小時）</option>
                    <option value="1H">1H（一小時）</option>
                    <option value="15m">15m（十五分鐘）</option>
                  </select>
                </label>

                <label>
                  操作偏好
                  <select id="style">
                    <option value="短線">短線</option>
                    <option value="波段">波段</option>
                    <option value="保守">保守</option>
                  </select>
                </label>
              </div>
            </details>

            <details class="accordion-item" id="accordion-notes">
              <summary>
                <span>補充選項</span>
                <small>事件、新聞、你自己的觀察</small>
              </summary>
              <div class="accordion-body">
                <label>
                  補充資訊（可選）
                  <textarea
                    id="notes"
                    rows="3"
                    placeholder="例如：下週有法說會、已連續上漲 5 天、近期成交量放大..."
                  ></textarea>
                </label>
              </div>
            </details>

            <details class="accordion-item" id="accordion-kline">
              <summary>
                <span>K 線資料</span>
                <small>必填，CSV：open,high,low,close,volume</small>
              </summary>
              <div class="accordion-body">
                <label>
                  K 線資料（必填，CSV 格式）
                  <textarea
                    id="kline-data"
                    rows="8"
                    required
                    placeholder="每行一根 K，格式：open,high,low,close,volume&#10;例如：930,938,925,935,21500"
                  ></textarea>
                  <small>
                    建議至少貼上 20 根 K。若你只有收盤價，可填成：close,close,close,close,0
                  </small>
                </label>
              </div>
            </details>
          </div>

          <div class="actions">
            <button type="button" id="sample-btn" class="secondary">載入範例資料</button>
            <button type="button" id="download-btn" class="secondary">下載 index.html</button>
            <button type="submit">開始分析</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>K 線視覺化</h2>
        <canvas id="chart" width="1000" height="360" aria-label="K線圖"></canvas>
      </section>

      <section class="card result-card">
        <h2>分析結果</h2>
        <div id="result-empty" class="empty">輸入資料後按下「開始分析」，結果會顯示在這裡。</div>
        <div id="result" class="hidden">
          <article>
            <h3>1. 市場狀態</h3>
            <p id="state"></p>
          </article>
          <article>
            <h3>2. 股價位置意義</h3>
            <p id="meaning"></p>
          </article>
          <article>
            <h3>3. 可能劇本</h3>
            <ul id="scenarios"></ul>
          </article>
          <article>
            <h3>4. 風險提醒</h3>
            <ul id="risks"></ul>
          </article>
          <article>
            <h3>5. 觀察與優化建議</h3>
            <ul id="actions"></ul>
          </article>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("analysis-form");
      const sampleBtn = document.getElementById("sample-btn");
      const downloadBtn = document.getElementById("download-btn");
      const resultEmpty = document.getElementById("result-empty");
      const resultBox = document.getElementById("result");
      const accordionItems = Array.from(document.querySelectorAll(".accordion-item"));

      const output = {
        state: document.getElementById("state"),
        meaning: document.getElementById("meaning"),
        scenarios: document.getElementById("scenarios"),
        risks: document.getElementById("risks"),
        actions: document.getElementById("actions"),
      };

      const chart = document.getElementById("chart");
      const ctx = chart.getContext("2d");
      let lastRows = [];
      let lastPrice = null;

      function openAccordion(targetId) {
        accordionItems.forEach((item) => {
          item.open = item.id === targetId;
        });
      }

      accordionItems.forEach((item) => {
        item.addEventListener("toggle", () => {
          if (!item.open) return;
          accordionItems.forEach((other) => {
            if (other !== item) other.open = false;
          });
        });
      });

      function parseRows(raw) {
        return raw
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const [open, high, low, close, volume] = line.split(",").map((v) => Number(v.trim()));
            if ([open, high, low, close].some((v) => Number.isNaN(v) || v <= 0)) {
              throw new Error(`資料格式錯誤：${line}`);
            }
            return { open, high, low, close, volume: Number.isNaN(volume) ? 0 : volume };
          });
      }

      function average(values) {
        if (!values.length) return 0;
        return values.reduce((sum, value) => sum + value, 0) / values.length;
      }

      function movingAverage(closes, window) {
        if (closes.length < window) return null;
        return average(closes.slice(-window));
      }

      function calcRsi(closes, period = 14) {
        if (closes.length <= period) return null;
        let gains = 0;
        let losses = 0;

        for (let i = closes.length - period; i < closes.length; i += 1) {
          const diff = closes[i] - closes[i - 1];
          if (diff >= 0) gains += diff;
          else losses += Math.abs(diff);
        }

        if (losses === 0) return 100;
        const rs = gains / losses;
        return 100 - 100 / (1 + rs);
      }

      function getTrend(price, ma5, ma20) {
        if (!ma5 || !ma20) return "資料不足";
        if (price > ma5 && ma5 > ma20) return "偏多";
        if (price < ma5 && ma5 < ma20) return "偏空";
        return "盤整";
      }

      function getSupportResistance(rows) {
        const recent = rows.slice(-20);
        const support = Math.min(...recent.map((row) => row.low));
        const resistance = Math.max(...recent.map((row) => row.high));
        return { support, resistance };
      }

      function distancePercent(price, target) {
        return ((price - target) / target) * 100;
      }

      function confidenceScore({ trend, rsi, price, support, resistance }) {
        let score = 50;
        if (trend === "偏多") score += 20;
        if (trend === "偏空") score -= 20;
        if (rsi !== null && rsi > 55 && rsi < 75) score += 10;
        if (rsi !== null && rsi < 45 && rsi > 25) score -= 10;

        const pos = (price - support) / Math.max(resistance - support, 1e-6);
        if (pos >= 0.45 && pos <= 0.7) score += 10;
        if (pos > 0.9 || pos < 0.1) score -= 5;

        if (score >= 70) return "高";
        if (score >= 45) return "中";
        return "低";
      }

      function analyze(input) {
        const closes = input.rows.map((row) => row.close);
        const ma5 = movingAverage(closes, 5);
        const ma20 = movingAverage(closes, 20);
        const rsi = calcRsi(closes);
        const trend = getTrend(input.price, ma5, ma20);
        const { support, resistance } = getSupportResistance(input.rows);

        const nearSupport = distancePercent(input.price, support);
        const nearResistance = distancePercent(input.price, resistance);
        const signalLevel = confidenceScore({
          trend,
          rsi,
          price: input.price,
          support,
          resistance,
        });

        const state = `${input.market} ${input.symbol}（${input.timeframe}）目前結構為「${trend}」，訊號一致性為 ${signalLevel}。`;

        let meaning = `目前價格 ${input.price.toFixed(2)}，20 根區間支撐約 ${support.toFixed(
          2
        )}、壓力約 ${resistance.toFixed(2)}。`;

        if (nearResistance > -1.5 && nearResistance < 0) {
          meaning += " 價格正在壓力位下方測壓，若無量突破容易拉回。";
        } else if (nearSupport > 0 && nearSupport < 1.5) {
          meaning += " 價格靠近支撐區，若守住有機會出現技術反彈。";
        } else if (input.price > resistance) {
          meaning += " 價格已突破近 20 根壓力，需觀察是否站穩與量能續強。";
        } else if (input.price < support) {
          meaning += " 價格跌破近 20 根支撐，代表短線結構轉弱。";
        } else {
          meaning += " 價格位於區間中段，建議等待方向更明確。";
        }

        if (ma5 && ma20) {
          meaning += ` 均線參考：MA5=${ma5.toFixed(2)}，MA20=${ma20.toFixed(2)}。`;
        }
        if (rsi !== null) {
          meaning += ` RSI14=${rsi.toFixed(1)}。`;
        }

        const scenarios = [];
        if (input.price >= resistance * 0.995) {
          scenarios.push("若放量突破壓力並連續兩根 K 收在其上方，可視為趨勢延續訊號。");
          scenarios.push("若突破但量能不足，常見假突破後回測壓力轉支撐失敗。");
        } else if (input.price <= support * 1.005) {
          scenarios.push("若支撐守住且短線量增，可能出現跌深反彈。");
          scenarios.push("若有效跌破支撐且反彈無力，可能展開下一段下跌。");
        } else {
          scenarios.push("目前偏區間整理，突破壓力或跌破支撐前以觀察為主。");
          scenarios.push("若後續出現帶量長紅/長黑，方向訊號會更明確。");
        }

        const risks = [
          `關鍵風險位：${support.toFixed(2)}（跌破可能轉弱）`,
          `關鍵壓力位：${resistance.toFixed(2)}（未突破前容易震盪）`,
          "單一指標容易失真，請搭配事件風險（財報、法說會、總體數據）。",
        ];

        const actions = [
          `依你的「${input.style}」偏好，先定義失效點與風險報酬比（至少 1:1.5）。`,
          "把分析流程固定化：趨勢（MA）→結構（支撐壓力）→動能（RSI）→量能驗證。",
          "若要優化程式，可加入多時間框架一致性（日線 + 1H）加權評分。",
          "下一版可加入回測與到價提醒，讓分析結果可追蹤與驗證。",
        ];

        if (input.notes.trim()) {
          actions.push(`你提供的補充資訊重點：${input.notes.trim()}`);
        }

        return {
          state,
          meaning,
          scenarios,
          risks,
          actions,
        };
      }

      function drawChart(rows, currentPrice) {
        const rect = chart.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        ctx.clearRect(0, 0, width, height);

        const padding = { top: 20, right: 20, bottom: 28, left: 20 };
        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        const highs = rows.map((row) => row.high);
        const lows = rows.map((row) => row.low);
        const max = Math.max(...highs, currentPrice);
        const min = Math.min(...lows, currentPrice);
        const range = Math.max(max - min, 1e-6);

        const candleWidth = Math.max(chartWidth / rows.length - 4, 2);
        const step = chartWidth / rows.length;

        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding.left, padding.top + chartHeight);
        ctx.lineTo(width - padding.right, padding.top + chartHeight);
        ctx.stroke();

        rows.forEach((row, i) => {
          const x = padding.left + i * step + step / 2;
          const yHigh = padding.top + ((max - row.high) / range) * chartHeight;
          const yLow = padding.top + ((max - row.low) / range) * chartHeight;
          const yOpen = padding.top + ((max - row.open) / range) * chartHeight;
          const yClose = padding.top + ((max - row.close) / range) * chartHeight;
          const up = row.close >= row.open;

          ctx.strokeStyle = up ? "#16a34a" : "#dc2626";
          ctx.fillStyle = up ? "#22c55e" : "#ef4444";

          ctx.beginPath();
          ctx.moveTo(x, yHigh);
          ctx.lineTo(x, yLow);
          ctx.stroke();

          const bodyY = Math.min(yOpen, yClose);
          const bodyH = Math.max(Math.abs(yOpen - yClose), 2);
          ctx.fillRect(x - candleWidth / 2, bodyY, candleWidth, bodyH);
        });

        const yPrice = padding.top + ((max - currentPrice) / range) * chartHeight;
        ctx.strokeStyle = "#1d4ed8";
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(padding.left, yPrice);
        ctx.lineTo(width - padding.right, yPrice);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = "#1d4ed8";
        ctx.font = "14px sans-serif";
        ctx.fillText(`現價 ${currentPrice.toFixed(2)}`, padding.left + 8, Math.max(yPrice - 6, 16));
      }

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        const rect = chart.getBoundingClientRect();
        chart.width = Math.max(Math.floor(rect.width * ratio), 320);
        chart.height = Math.floor(260 * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        if (lastRows.length && lastPrice !== null) {
          drawChart(lastRows, lastPrice);
        }
      }

      function renderList(target, items) {
        target.innerHTML = "";
        items.forEach((text) => {
          const li = document.createElement("li");
          li.textContent = text;
          target.appendChild(li);
        });
      }

      async function downloadCurrentIndex() {
        const html = `<!DOCTYPE html>\n${document.documentElement.outerHTML}`;
        const blob = new Blob([html], { type: "text/html;charset=utf-8" });

        // Mobile-first: if Web Share supports files, let users save/share directly from phone.
        if (typeof File !== "undefined" && navigator.share && navigator.canShare) {
          const file = new File([blob], "index.html", { type: "text/html" });
          if (navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: "index.html",
                text: "K 線與股價分析助手 landing page",
                files: [file],
              });
              return;
            } catch (error) {
              if (error && error.name === "AbortError") return;
            }
          }
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "index.html";
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function runAnalysis() {
        const symbol = document.getElementById("symbol").value.trim();
        const market = document.getElementById("market").value;
        const price = Number(document.getElementById("price").value);
        const timeframe = document.getElementById("timeframe").value;
        const style = document.getElementById("style").value;
        const notes = document.getElementById("notes").value;
        const rawData = document.getElementById("kline-data").value.trim();

        if (!symbol || Number.isNaN(price) || price <= 0) {
          openAccordion("accordion-basic");
          alert("請先填寫股票代碼與有效股價。");
          return;
        }

        let rows = [];
        try {
          rows = parseRows(rawData);
        } catch (error) {
          openAccordion("accordion-kline");
          alert(error.message);
          return;
        }

        if (rows.length < 20) {
          openAccordion("accordion-kline");
          alert("建議至少輸入 20 根 K，分析會比較穩定。");
          return;
        }

        const report = analyze({
          symbol,
          market,
          price,
          timeframe,
          style,
          notes,
          rows,
        });

        output.state.textContent = report.state;
        output.meaning.textContent = report.meaning;
        renderList(output.scenarios, report.scenarios);
        renderList(output.risks, report.risks);
        renderList(output.actions, report.actions);

        resultEmpty.classList.add("hidden");
        resultBox.classList.remove("hidden");

        lastRows = rows.slice(-60);
        lastPrice = price;
        drawChart(lastRows, lastPrice);
      }

      sampleBtn.addEventListener("click", () => {
        const symbol = document.getElementById("symbol");
        const price = document.getElementById("price");
        const notes = document.getElementById("notes");
        const data = document.getElementById("kline-data");
